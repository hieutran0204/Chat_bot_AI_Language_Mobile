# name: pubspec.yaml
# description: Main project dependencies for Language AI Mobile (Flutter)
name: language_ai_mobile
description: "AI English Tutor — Voice-first speaking tutor for Vietnamese learners."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # ── Dependency Injection ──────────────────────────────────
  get_it: ^8.0.3
  injectable: ^2.5.0

  # ── Networking ────────────────────────────────────────────
  dio: ^5.8.0
  http: ^1.4.0              # SSE streaming (dart:http StreamedResponse)
  pretty_dio_logger: ^1.4.0

  # ── Secure Storage (JWT) ──────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Serialization ─────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Functional Error Handling ─────────────────────────────
  dartz: ^0.10.1

  # ── Environment Configuration ─────────────────────────────
  flutter_dotenv: ^5.2.1

  # ── UI & Fonts ────────────────────────────────────────────
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  gap: ^3.0.1               # SizedBox replacement

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # ── Code Generation ───────────────────────────────────────
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
